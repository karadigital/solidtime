name: Build - Kara

# Builds the production Docker image from this fork and pushes it to GHCR.
# Pull requests only build the image (no push) to catch Dockerfile breakage early.

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - '.github/workflows/build-kara.yml'
      - '.dockerignore'
      - 'docker/prod/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/karadigital/solidtime

concurrency:
  group: build-kara-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: "Check out code"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Required to find the latest version tag

      - name: "Get version and build"
        id: release
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            tag=$(git describe --tags --abbrev=0 --match 'v*[0-9].*[0-9].*[0-9]' 2>/dev/null || echo "v0.0.0")
            version="${tag#v}"
          fi
          echo "app_version=${version}" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_OUTPUT"

      - name: "Prepare production .env"
        run: |
          cp .env.production .env
          rm .env.production .env.ci .env.example
          sed -i 's/APP_VERSION=0.0.0/APP_VERSION=${{ steps.release.outputs.app_version }}/g' .env
          sed -i 's/APP_BUILD=0/APP_BUILD=${{ steps.release.outputs.build }}/g' .env
          cat .env

      - name: "Setup PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, fileinfo, pgsql

      - name: "Install composer dependencies"
        run: composer install --no-dev --no-ansi --no-interaction --prefer-dist --ignore-platform-reqs --classmap-authoritative

      - name: "Use Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: '20.x'

      - name: "Install npm dependencies"
        run: npm ci

      - name: "Build frontend assets"
        run: npm run build

      - name: "Docker meta"
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: "Login to GitHub Container Registry"
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v4

      - name: "Build and push"
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod/Dockerfile
          build-args: |
            DOCKER_FILES_BASE_PATH=docker/prod/
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
